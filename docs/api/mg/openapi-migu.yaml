        - type: integer
          minimum: 1
        - type: string
          minLength: 1
          maxLength: 64
    SyncStatus:
      type: integer
      enum: [0, 1, 2, 3, 4]
      description: 'Metadata sync status: 0 pending, 1 running, 2 completed, 3 failed, 4 partial.'
    CatalogPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
