    {
      "get": {
        "tags": [
          "migu"
        ],
        "summary": "List local and cloud singer or album cover states",
        "parameters": [
          {
            "name": "owner_type",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "singer",
                "album"
              ]
            }
          },
          {
            "name": "source",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "migu"
              ]
            }
          },
          {
            "name": "resource_ids",
            "in": "query",
            "schema": {
              "type": "string",
              "description": "Comma-separated positive resource IDs, at most 200."
            }
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-3](,[0-3]){0,3}$"
            }
          },
          {
            "name": "cloud_status",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-4](,[0-4]){0,4}$"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 20
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Cover queue",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MetadataCoverPage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid query",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "503": {
            "description": "Cover service or persistence unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    }
  /api/migu/covers/process:
    {
      "post": {
        "tags": [
          "migu"
        ],
        "summary": "Download covers and automatically upload when cloud storage is enabled",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MetadataCoverRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Completed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MetadataCoverProcessResponse"
                }
              }
            }
          },
          "202": {
            "description": "Background batch accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MetadataCoverAccepted"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "503": {
            "description": "Cover service or persistence unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        },
        "description": "Metadata collection stores URLs only. This operation accepts stored resource IDs or filters, never arbitrary URLs or paths. async defaults to true; poll or cancel through existing task routes. Cloud disabled: process local states 0/3, or 2 with explicit refresh. Cloud enabled: also select completed local files with missing, failed, uncertain or outdated cloud receipts and upload existing verified bytes without re-fetching Migu. Backend baidupcs or rclone is selected by server configuration. Success requires verified cloud content and conditional database confirmation. Cloud errors preserve local completion and are reported separately. Explicit refresh requires resource_ids."
      }
    }
