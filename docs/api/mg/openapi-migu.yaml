openapi: 3.0.3
info:
  title: Crawler Migu Metadata API
  version: 1.9.0
  description: Migu metadata, song resource processing, and singer/album cover storage API. Cover tasks download stored URLs, expose verified local images, and automatically upload and confirm cloud receipts through BaiduPCS-Go or rclone Google Drive when configured.
servers:
  - url: http://127.0.0.1:8080
    description: Local crawler service
tags:
  - name: migu
    description: Migu metadata crawl and resource processing operations
  - name: system
    description: Service health and OpenAPI document
paths:
  /api/migu/singers/crawl:
    post:
      tags: [migu]
      summary: Crawl singer catalog
      description: Crawl Migu singer categories and save singers plus singer_source_refs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingerIndexCrawlRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/migu/singers/profile/refresh-from-db:
    post:
      tags: [migu]
      summary: Refresh singer profiles from database
      description: Refresh whole singer profiles without crawling directories or downloading images. Missing declared totals are selected by default; zero is known. Unknown classification and directory status, timestamps and claims are preserved.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingerProfileRefreshRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '200':
          description: No eligible profiles; returns batch_id=null, claimed_count, skipped_count and items.
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Singer profile refresh is not configured.
  /api/migu/singer-songs/crawl-from-db:
    post:
      tags: [migu]
      summary: Crawl singer songs from database queue
      description: Claim singers from singer_source_refs by songs_sync_status and crawl songs. Empty country, gender and q filters are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingerFromDbCrawlRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/migu/singer-songs/crawl-from-db/preview:
    post:
      tags: [migu]
      summary: Preview singer songs crawl from database queue
      description: Returns matched count, eligible count and target samples before claiming singer_source_refs rows for song crawling.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingerFromDbCrawlRequest'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingerFromDbPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/migu/singer-albums/crawl-from-db:
    post:
      tags: [migu]
      summary: Crawl singer albums from database queue
      description: Claim singers from singer_source_refs by albums_sync_status and crawl albums. Empty country, gender and q filters are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingerFromDbCrawlRequest'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/migu/singer-albums/crawl-from-db/preview:
    post:
      tags: [migu]
      summary: Preview singer albums crawl from database queue
      description: Returns matched count, eligible count and target samples before claiming singer_source_refs rows for album crawling.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingerFromDbCrawlRequest'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingerFromDbPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/migu/singers:
    get:
      tags: [migu]
      summary: List Migu singers
      description: Supports q, source_singer_id, gender, country, songs_sync_status and albums_sync_status. q keeps fuzzy singer name/source_singer_id matching, but exact source_singer_id matches are ranked first. source_singer_id applies an exact ID filter. Status filters use the same exposed status returned by SingerRecord. Song and album summary counts are derived from real relationships, while source_song_total/source_album_total come from Migu singer/info profile refresh. Directory sync status comes from its own collection result. Related entity counts do not prove directory coverage; when totals are null, full completion cannot be confirmed.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: source_singer_id, in: query, required: false, description: "Exact Migu source_singer_id filter.", schema: { type: string, maxLength: 64 } }
        - { name: gender, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: country, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: songs_sync_status, in: query, required: false, description: "Comma-separated persisted singer-song directory sync statuses; relationship counts do not override collection results.", schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: albums_sync_status, in: query, required: false, description: "Comma-separated persisted singer-album directory sync statuses; relationship counts do not override collection results.", schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: min_songs_count, in: query, required: false, description: "Minimum real song relation count from song_artist_refs.", schema: { type: integer, minimum: 0 } }
        - { name: max_songs_count, in: query, required: false, description: "Maximum real song relation count from song_artist_refs.", schema: { type: integer, minimum: 0 } }
        - { name: min_albums_count, in: query, required: false, description: "Minimum real album relation count from album_artist_refs.", schema: { type: integer, minimum: 0 } }
        - { name: max_albums_count, in: query, required: false, description: "Maximum real album relation count from album_artist_refs.", schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/SingerRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/singers/{source_singer_id}:
    get:
      tags: [migu]
      summary: Get Migu singer
      description: Returns one singer by Migu source_singer_id with real relationship summary counts, Migu declared totals, remaining counts and completion booleans.
      parameters:
        - { name: source_singer_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Singer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingerRecord'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/migu/singers/{source_singer_id}/songs:
    get:
      tags: [migu]
      summary: List Migu singer songs
      parameters:
        - { name: source_singer_id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: artist, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: album, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: resource_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: format, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { $ref: '#/components/responses/SongRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/singers/{source_singer_id}/albums:
    get:
      tags: [migu]
      summary: List Migu singer albums
      parameters:
        - { name: source_singer_id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: artist, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: kind, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2 } }
        - { name: detail_sync_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: songs_sync_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: min_songs_count, in: query, required: false, description: "Minimum real album-song relation count from album_song_refs.", schema: { type: integer, minimum: 0 } }
        - { name: max_songs_count, in: query, required: false, description: "Maximum real album-song relation count from album_song_refs.", schema: { type: integer, minimum: 0 } }
        - { name: min_album_songs_count, in: query, required: false, description: "Alias of min_songs_count for album-song relation filtering.", schema: { type: integer, minimum: 0 } }
        - { name: max_album_songs_count, in: query, required: false, description: "Alias of max_songs_count for album-song relation filtering.", schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/AlbumRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/albums:
    get:
      tags: [migu]
      summary: List Migu albums
      description: Supports q, artist, kind, detail_sync_status and songs_sync_status.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: artist, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: kind, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2 } }
        - { name: detail_sync_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: songs_sync_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: min_songs_count, in: query, required: false, description: "Minimum real album-song relation count from album_song_refs.", schema: { type: integer, minimum: 0 } }
        - { name: max_songs_count, in: query, required: false, description: "Maximum real album-song relation count from album_song_refs.", schema: { type: integer, minimum: 0 } }
        - { name: min_album_songs_count, in: query, required: false, description: "Alias of min_songs_count for album-song relation filtering.", schema: { type: integer, minimum: 0 } }
        - { name: max_album_songs_count, in: query, required: false, description: "Alias of max_songs_count for album-song relation filtering.", schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/AlbumRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/albums/{source_album_id}:
    get:
      tags: [migu]
      summary: Get Migu album
      parameters:
        - { name: source_album_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Album record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumRecord'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/migu/albums/{source_album_id}/songs:
    get:
      tags: [migu]
      summary: List Migu album songs
      parameters:
        - { name: source_album_id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: artist, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: album, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: resource_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: format, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { $ref: '#/components/responses/SongRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/songs:
    get:
      tags: [migu]
      summary: List Migu songs
      description: Supports q, artist, album, resource_status and format.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: artist, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: album, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: resource_status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: format, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { $ref: '#/components/responses/SongRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/songs/{source_song_id}:
    get:
      tags: [migu]
      summary: Get Migu song
      parameters:
        - { name: source_song_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Song record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongRecord'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/migu/resources/queue:
    get:
      tags: [migu]
      summary: List Migu resource queue
      description: Resource task queue view. This API does not fetch or download resources.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, required: false, schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: kind, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: format, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { $ref: '#/components/responses/ResourceQueueRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/resources/preview:
    post:
      tags: [migu]
      summary: Preview Migu resource queue governance
      description: Returns matched, eligible, ineligible and missing resource counts before retry/reset/recover-stale. This endpoint does not write database rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionRequest'
      responses:
        '200':
          description: Resource governance preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePreviewResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/resources/retry:
    post:
      tags: [migu]
      summary: Retry Migu resource queue records
      description: Marks selected failed resource records as pending. Skipped resources remain skipped. It does not fetch, probe or download resources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionRequest'
      responses:
        '200':
          description: Resource action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceActionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/resources/reset:
    post:
      tags: [migu]
      summary: Reset Migu resource queue records
      description: Resets selected resource records to pending and clears retry/error metadata. It does not delete files or fetch resources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionRequest'
      responses:
        '200':
          description: Resource action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceActionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/resources/recover-stale:
    post:
      tags: [migu]
      summary: Recover stale Migu resource queue records
      description: Marks selected stale running resource records as failed so they can be governed later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionRequest'
      responses:
        '200':
          description: Resource action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceActionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/resources/process:
    post:
      tags: [migu]
      summary: Process Migu resource queue
      description: Claims pending resource records, obtains temporary Migu resource URLs, downloads content, saves bytes and writes results back to MySQL. Current filesystem song processing does not automatically upload; CRAWLER_RESOURCE_CLOUD_UPLOAD_ENABLED applies to metadata covers through /api/migu/covers/process. Legacy rclone copyurl storage is selected separately. Known digital albums are skipped without requesting resource URLs. Set async=true for long-running background processing; item and event rows are written in real time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceProcessRequest'
      responses:
        '200':
          description: Resource processing result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProcessResponse'
        '202':
          description: Resource processing accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceProcessAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/migu/pacmtoken/refresh:
    post:
      tags: [migu]
      summary: Refresh Migu pacmtoken
      description: Calls Migu checkPacMtoken with the current pacmtoken, stores the successful token in backend memory by default, and returns the token for the frontend timer. The initial token must be provided by the caller; this endpoint does not implement login, does not read Migu Cookie environment variables, and does not write .env.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacmtokenRefreshRequest'
      responses:
        '200':
          description: pacmtoken refreshed or still valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacmtokenRefreshResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '502':
          description: Migu checkPacMtoken failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/migu/pacmtoken/state:
    get:
      tags: [migu]
      summary: Get runtime pacmtoken state
      description: Returns only token length and updated time. The token value is not included and this state is not persisted.
      responses:
        '200':
          description: pacmtoken state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacmtokenStateResponse'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/migu/pacmtoken/current:
    post:
      tags: [migu]
      summary: Get current runtime pacmtoken
      description: Returns the current in-memory token so the frontend can update local storage after long-running auto refresh. Do not log this response body.
      responses:
        '200':
          description: current pacmtoken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacmtokenCurrentResponse'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/migu/dictionaries:
    get:
      tags: [migu]
      summary: Get Migu frontend dictionaries
      description: Returns sync status, gender, album kind, resource kind, audio format, error category and result code dictionaries.
      responses:
        '200':
          description: Dictionary values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
  /api/migu/backfill/{type}/queue:
    get:
      tags: [migu]
      summary: List Migu backfill queue
      description: Singer-song and singer-album queues use persisted directory collection status from /api/migu/singers. Related song_artist_refs and album_artist_refs counts remain statistics; they do not complete an uncollected directory. Default status is 0,3,4; force can include completed (2) directories but cannot steal an active task.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [singer-songs, singer-albums, album-details, album-songs] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, required: false, description: "Comma-separated effective metadata sync statuses. Defaults to 0,3,4. Singer queues use persisted directory collection status, independent of relationship counts.", schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: sync_status, in: query, required: false, description: "Alias of status with the same effective real-relation status semantics.", schema: { type: string, pattern: '^[0-4](,[0-4])*$' } }
        - { name: country, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: gender, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: artist, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: kind, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2 } }
        - { name: min_songs_count, in: query, required: false, description: "Minimum real relation count. Singer-song queues use song_artist_refs; album queues use album_song_refs.", schema: { type: integer, minimum: 0 } }
        - { name: max_songs_count, in: query, required: false, description: "Maximum real relation count. Singer-song queues use song_artist_refs; album queues use album_song_refs.", schema: { type: integer, minimum: 0 } }
        - { name: min_albums_count, in: query, required: false, description: "Minimum real singer-album relation count. Applies to singer queues.", schema: { type: integer, minimum: 0 } }
        - { name: max_albums_count, in: query, required: false, description: "Maximum real singer-album relation count. Applies to singer queues.", schema: { type: integer, minimum: 0 } }
        - { name: min_album_songs_count, in: query, required: false, description: "Alias of min_songs_count for album queues.", schema: { type: integer, minimum: 0 } }
        - { name: max_album_songs_count, in: query, required: false, description: "Alias of max_songs_count for album queues.", schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/BackfillQueuePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/migu/backfill/{type}/preview:
    post:
      tags: [migu]
      summary: Preview Migu backfill targets
      description: Returns matched count, eligible count, missing count and sample targets before retry or reset. It does not claim or reset records.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [singer-songs, singer-albums, album-details, album-songs] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillActionRequest'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillPreviewResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
