    ResourceActionRequest:
      type: object
      description: Govern resource queue records only. It does not fetch, probe or download resource URLs.
      properties:
        source:
          type: string
          enum: [migu]
          default: migu
        action:
          type: string
          enum: [retry, reset, recover-stale]
          description: Required by /api/migu/resources/preview. Ignored by concrete retry/reset/recover endpoints.
        resource_ids:
          type: array
          items: { type: integer, minimum: 1 }
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
        stale_after_seconds:
          type: integer
          minimum: 1
          default: 3600
        filter:
          type: object
          additionalProperties: true
          description: Supports status/resource_status, q, kind and format.
    ResourceProcessRequest:
      type: object
      description: Claims pending Migu resource records, fetches the resource URL when needed, downloads content and writes back status. Current filesystem song processing does not automatically upload saved files; cover cloud settings are independent. Legacy rclone copyurl storage is selected separately. Use async=true for long-running batches. Audio resources use the runtime pacmtoken stored through POST /api/migu/pacmtoken/refresh and may auto-refresh it during processing; tokens are not written to batch tables or logs.
      properties:
        source:
          type: string
          enum: [migu]
          default: migu
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        offset:
          type: integer
          minimum: 0
          default: 0
        async:
          type: boolean
          default: false
          description: When true, returns 202 with batch_id and processes resources in the background.
        batch_id:
          type: string
          description: Optional caller-provided batch id; generated when omitted.
        filter:
          type: object
          additionalProperties: true
          description: Supports status/resource_status/resourceStatus/statuses, kind/resource_kind/resourceKind, format/format_type/formatType and content_id/contentId/source_content_id/sourceContentId. Valid kinds are audio, cover, lyric/lrc, mrc and trc.
        options:
          $ref: '#/components/schemas/ResourceProcessOptions'
      example:
        source: migu
        limit: 10
        offset: 0
        filter:
          kind: audio
          format: ZQ24
          content_id: '600902000006889266'
          status: [0, 3]
        options:
          resource_download_concurrency: 3
          resource_download_retries: 1
          resource_download_timeout_ms: 120000
          pacmtoken_refresh_interval_seconds: 300
          auto_refresh_pacmtoken: true
          refresh_pacmtoken_on_440013: true
    ResourceProcessOptions:
      type: object
      description: Per-request resource download options. Omitted fields use GET /api/migu/settings mutable defaults.
      properties:
        resource_download_concurrency:
          type: integer
          minimum: 1
          maximum: 32
          default: 3
        resourceDownloadConcurrency:
          type: integer
          minimum: 1
          maximum: 32
        resource_download_retries:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
        resourceDownloadRetries:
          type: integer
          minimum: 0
          maximum: 5
        resource_download_timeout_ms:
          type: integer
          minimum: 10000
          maximum: 600000
          default: 120000
        resourceDownloadTimeoutMs:
          type: integer
          minimum: 10000
          maximum: 600000
        pacmtoken_refresh_interval_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 300
          description: 0 disables periodic long-run refresh.
        pacmtokenRefreshIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        auto_refresh_pacmtoken:
          type: boolean
          default: true
        autoRefreshPacmtoken:
          type: boolean
        refresh_pacmtoken_on_440013:
          type: boolean
          default: true
        refreshPacmtokenOn440013:
          type: boolean
        process_related_resources:
          type: boolean
          default: true
          description: When false, audio processing does not claim or store cover/lyric/mrc/trc URLs returned by the audio resource response.
        processRelatedResources:
          type: boolean
    ResourceProcessAcceptedResponse:
      type: object
      required: [accepted, async, batch_id, task_url, items_url, events_url]
      properties:
        accepted: { type: boolean }
        async: { type: boolean }
        batch_id: { type: string }
        task_url: { type: string }
        items_url: { type: string }
        events_url: { type: string }
    ResourceProcessItem:
      type: object
      required: [resource_id, resource_kind, format_type, ok, skipped, related, synthetic, local_path, cloud_backend, cloud_path, size_bytes, checksum, error_category, result_code, message]
      properties:
        resource_id: { type: integer, minimum: 0 }
        song_source_ref_id: { type: integer, minimum: 0 }
        source: { type: string }
        source_song_id: { type: string }
        source_content_id: { type: string }
        title: { type: string }
        resource_kind: { type: string }
        format_type: { type: string }
        ok: { type: boolean }
        skipped: { type: boolean }
        related:
          type: boolean
          description: True when the item was discovered from an audio response cover/lyric/mrc/trc URL.
        synthetic:
          type: boolean
          description: True when no real resource row could be claimed, for example related_not_claimed.
        local_path:
          type: string
          description: Storage path returned by the blob store after save. Empty when the item did not save content.
        cloud_backend:
          type: string
          description: Compatibility cloud adapter field. Current filesystem song processing does not automatically upload; cover cloud settings do not enable the song uploader. Stored queue receipts may be historical or manually reconciled.
        cloud_path:
          type: string
          description: Compatibility cloud object path, not a public URL. New filesystem song process results are empty; stored queue records may retain a last confirmed historical or manually reconciled path.
        size_bytes: { type: integer, minimum: 0 }
        checksum: { type: string }
        error_category:
          type: string
          description: Failure or skip category. Empty when ok is true.
        result_code: { type: string }
        message: { type: string }
    ResourceProcessResponse:
      type: object
      required: [batch_id, claimed_count, succeeded_count, failed_count, skipped_count, related_succeeded_count, related_failed_count, related_skipped_count, synthetic_related_skipped_count, items]
      properties:
        batch_id: { type: string }
        claimed_count: { type: integer, minimum: 0 }
        succeeded_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }
        skipped_count: { type: integer, minimum: 0 }
        related_succeeded_count:
          type: integer
          minimum: 0
