    SingerRecord:
      type: object
      required: [source, source_singer_id, name, songs_sync_status, albums_sync_status]
      properties:
        singer_db_id: { type: integer, minimum: 0 }
        name: { type: string }
        normalized_name: { type: string }
        gender: { type: integer, minimum: 0, maximum: 3 }
        source_ref_id: { type: integer, minimum: 0 }
        source: { type: string, enum: [migu] }
        source_item_key: { type: string }
        source_singer_id: { type: string }
        source_name_pinyin: { type: string }
        country: { type: string }
        source_tag: { type: string }
        source_song_total: { nullable: true, type: integer, minimum: 0, description: "Migu-declared singer song total from singer/info. Null means not refreshed yet and full completion cannot be confirmed." }
        source_album_total: { nullable: true, type: integer, minimum: 0, description: "Migu-declared singer album total from singer/info. Null means not refreshed yet and full completion cannot be confirmed." }
        avatar_url: { type: string, description: "Remote singer image URL stored in singer_resources; metadata collection does not download the image." }
        cover: {allOf: [{"$ref": "#/components/schemas/MetadataCoverRecord"}], nullable: true}
        songs_sync_status:
          allOf:
            - $ref: '#/components/schemas/SyncStatus'
          description: Persisted singer-song directory sync status from its own collection result. Relationship counts do not prove directory completion (2). When source_song_total is null, full completion cannot be confirmed. Running (1) remains running.
        songs_synced_at: { nullable: true, type: integer, minimum: 0, description: "Unix timestamp of the last completed singer-song directory sync." }
        songs_count: { type: integer, minimum: 0, description: "Frontend display alias of songs_sync_count." }
        songs_total: { nullable: true, type: integer, minimum: 0, description: "Alias of source_song_total for progress displays." }
        songs_remaining_count: { nullable: true, type: integer, minimum: 0, description: "Remaining song count when source_song_total is known." }
        songs_completed: { type: boolean, description: "True when the exposed singer-song sync status is completed." }
        songs_sync_count: { type: integer, minimum: 0, description: "Distinct related song count derived from song_artist_refs for this Migu source_singer_id." }
        songs_sync_error: { type: string, description: "Last singer-song directory sync error." }
        songs_last_batch_id: { nullable: true, type: string }
        songs_running_batch_id: { nullable: true, type: string }
        albums_sync_status:
          allOf:
            - $ref: '#/components/schemas/SyncStatus'
          description: Persisted singer-album directory sync status from its own collection result. Relationship counts do not prove directory completion (2). When source_album_total is null, full completion cannot be confirmed. Running (1) remains running.
        albums_synced_at: { nullable: true, type: integer, minimum: 0, description: "Unix timestamp of the last completed singer-album directory sync." }
        albums_count: { type: integer, minimum: 0, description: "Frontend display alias of albums_sync_count." }
        albums_total: { nullable: true, type: integer, minimum: 0, description: "Alias of source_album_total for progress displays." }
        albums_remaining_count: { nullable: true, type: integer, minimum: 0, description: "Remaining album count when source_album_total is known." }
        albums_completed: { type: boolean, description: "True when the exposed singer-album sync status is completed." }
        albums_sync_count: { type: integer, minimum: 0, description: "Related album count derived from album_artist_refs for this Migu source_singer_id." }
        albums_sync_error: { type: string, description: "Last singer-album directory sync error." }
        albums_last_batch_id: { nullable: true, type: string }
        albums_running_batch_id: { nullable: true, type: string }
        created_at: { type: integer, minimum: 0 }
        updated_at: { type: integer, minimum: 0 }
    AlbumRecord:
      type: object
