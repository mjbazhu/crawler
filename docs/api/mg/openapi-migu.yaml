        related_failed_count:
          type: integer
          minimum: 0
          description: Related lyric, mrc or trc resources that failed to store.
        related_skipped_count:
          type: integer
          minimum: 0
          description: Related lyric, mrc or trc resources skipped because they were missing, already processed or not applicable.
        synthetic_related_skipped_count:
          type: integer
          minimum: 0
