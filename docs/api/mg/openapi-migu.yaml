      summary: Get Migu catalog integrity
      description: Returns lightweight counts for unfinished metadata, stale metadata running states, stale batches and stale resource tasks. Singer missing-song and missing-album counts use real relationship existence, using song_artist_refs for songs and album_artist_refs for albums, not only sync status fields.
