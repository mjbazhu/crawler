      properties:
        sync_status:
          type: array
          default: [0, 3, 4]
          items:
            type: integer
            minimum: 0
            maximum: 4
        syncStatus:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 4
        country:
          type: string
          maxLength: 128
          description: Optional source_country filter. Empty string disables it.
        gender:
          nullable: true
          type: integer
          minimum: 0
          maximum: 3
          description: Optional singer_source_refs.source_gender filter. Omit or null to disable it.
        q:
          type: string
          maxLength: 128
          description: Optional singer name/source_singer_id fuzzy keyword. Empty string disables it.
    SingerFromDbCrawlRequest:
      type: object
      description: Claim singers from singer_source_refs by sync status and start singer songs or albums crawl.
      properties:
        force:
          type: boolean
          default: false
          description: Include completed targets without taking active claims. Singer collection also refreshes the full singer profile once. Supported by collection, retry and preview; reset rejects true.
        source:
          type: string
          enum: [migu]
          default: migu
        filter:
          $ref: '#/components/schemas/SingerFromDbFilter'
        max_targets:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
          description: Maximum singers to claim from singer_source_refs.
        maxTargets:
          type: integer
          minimum: 1
          maximum: 1000
        limit_per_singer:
          type: integer
          minimum: 0
          maximum: 500
          default: 0
          description: Maximum songs or albums fetched for each singer. 0 means fetch all pages within workflow protection.
        limitPerSinger:
          type: integer
          minimum: 0
          maximum: 500
        include_stale_running:
          type: boolean
          default: false
          description: Whether to reclaim targets stuck in status 1 longer than stale_after_seconds.
        stale_after_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
