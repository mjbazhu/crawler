          "uploaded_at",
          "error_category",
          "result_code",
          "last_error"
        ],
        "properties": {
          "enabled": {
            "type": "boolean",
            "description": "Whether cloud upload is enabled in this server."
          },
          "status": {
            "type": "integer",
            "enum": [
              0,
              1,
              2,
              3,
              4
            ],
            "description": "Cloud state: pending, running, confirmed, failed, uncertain. Independent of local download status."
          },
          "current": {
            "type": "boolean",
            "description": "Confirmed receipt matches the committed local file and, while enabled, the configured backend and target prefix."
          },
          "backend": {
            "type": "string",
            "enum": [
              "",
              "baidupcs",
              "rclone"
            ],
            "description": "Backend of the last confirmed receipt; rclone includes Google Drive."
          },
          "path": {
            "type": "string",
            "description": "Last confirmed full object path, e.g. /Media/migu/... or gcloud:Media/migu/...; may remain available after refresh or upload failure."
          },
          "size_bytes": {
            "type": "integer",
            "minimum": 0
          },
          "checksum": {
            "type": "string",
            "description": "SHA-256 of the local snapshot whose remote content was verified."
          },
          "uploaded_at": {
            "type": "integer",
            "minimum": 0,
            "description": "Unix timestamp of last successful cloud confirmation."
          },
          "error_category": {
            "type": "string"
          },
          "result_code": {
            "type": "string"
          },
          "last_error": {
            "type": "string"
          }
        }
      }

    MetadataCoverRecord:
      {
        "type": "object",
        "required": [
          "owner_type",
          "resource_id",
          "source_ref_id",
          "status",
          "available",
          "local_url",
          "cloud"
        ],
        "properties": {
          "owner_type": {
            "type": "string",
            "enum": [
              "singer",
              "album"
            ]
          },
          "resource_id": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "source_ref_id": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "source": {
            "type": "string"
          },
          "source_id": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "enum": [
              0,
              1,
              2,
              3
            ],
            "description": "Download state: pending, running, complete, failed. A previous committed file may remain available while refreshing."
          },
          "available": {
            "type": "boolean",
            "description": "Queue and catalog availability is a lightweight path, existence and size check. Process reuse and content reads additionally verify the image and SHA-256; missing or corrupt local content fails processing while preserving the saved receipt."
          },
          "local_url": {
            "type": "string",
            "nullable": true,
            "description": "Owned local content route, present only while the committed file is available."
          },
          "local_path": {
            "type": "string"
          },
          "size_bytes": {
            "type": "integer",
            "minimum": 0
          },
          "checksum": {
            "type": "string"
          },
          "error_category": {
            "type": "string"
          },
          "result_code": {
            "type": "string"
          },
          "last_error": {
            "type": "string"
          },
          "cloud": {
            "$ref": "#/components/schemas/MetadataCoverCloud"
          }
        }
      }
    MetadataCoverRequest:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "owner_type"
        ],
        "properties": {
          "owner_type": {
            "type": "string",
            "enum": [
              "singer",
              "album"
            ]
          },
          "source": {
            "type": "string",
            "enum": [
              "migu"
            ],
            "default": "migu"
          },
          "resource_ids": {
            "type": "array",
            "maxItems": 200,
            "items": {
              "type": "integer",
              "format": "uint64",
              "minimum": 1
            }
          },
          "status": {
            "type": "array",
            "maxItems": 4,
            "items": {
              "type": "integer",
              "enum": [
                0,
                1,
                2,
                3
              ]
            }
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 20
          },
          "async": {
            "type": "boolean",
            "default": true
          },
          "refresh": {
            "type": "boolean",
            "default": false,
            "description": "Requires explicit resource_ids; keeps the previous committed image when refresh fails."
          },
          "concurrency": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32,
            "default": 3
          },
          "retries": {
            "type": "integer",
            "minimum": 0,
            "maximum": 5,
            "default": 1
          },
          "timeout_ms": {
            "type": "integer",
            "minimum": 100,
            "maximum": 600000,
            "default": 15000,
            "description": "Local download timeout. Cloud upload and verification use server CRAWLER_RESOURCE_CLOUD_TIMEOUT_MS, default 120000."
          },
          "stale_after_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 604800,
            "default": 1800
          },
          "cloud_status": {
            "type": "array",
            "maxItems": 5,
            "items": {
              "type": "integer",
              "enum": [
                0,
                1,
                2,
                3,
                4
              ]
            },
            "description": "Filter independent cloud state. Processing still obeys local eligibility and active-claim protection."
          }
        }
      }
