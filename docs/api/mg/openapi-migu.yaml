      anyOf:
        - required: [tab]
        - required: [singer_tab]
        - required: [tabs]
      properties:
        tab:
          $ref: '#/components/schemas/SingerTab'
        singer_tab:
          $ref: '#/components/schemas/SingerTab'
        singerTab:
          $ref: '#/components/schemas/SingerTab'
        tabs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SingerTab'
        singer_tabs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SingerTab'
        singerTabs:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SingerTab'
        limit:
          type: integer
          minimum: 0
          default: 20
          description: Maximum singers per selected category. Use 0 to crawl all singers parsed from each category.
        start_index:
          type: integer
          minimum: 0
          default: 0
          description: Inclusive 0-based start index.
        startPosition:
          type: integer
          minimum: 0
          description: Alias of start_index.
        start:
          type: integer
          minimum: 0
          description: Alias of start_index.
        end_index:
          type: integer
          minimum: 1
          description: Exclusive 0-based end index.
        endPosition:
          type: integer
          minimum: 1
          description: Alias of end_index.
        end:
          type: integer
          minimum: 1
          description: Alias of end_index.
    SingerFromDbFilter:
      type: object
