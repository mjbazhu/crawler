    PacmtokenRefreshRequest:
      type: object
      description: Refresh or validate a caller-provided Migu pacmtoken. The first call must provide pacmtoken or a Cookie string containing pacmtoken. Later calls may omit the body to reuse the token stored in backend runtime memory. The backend does not read Migu Cookie environment variables and does not persist the token.
      properties:
        pacmtoken:
          type: string
          maxLength: 8192
          description: Current raw pacmtoken. A full Cookie string containing pacmtoken is also accepted, but cookie is preferred for full Cookie input.
        cookie:
          type: string
          maxLength: 8192
          description: Optional full Cookie string copied from an authenticated browser session; pacmtoken is extracted server-side.
        store:
          type: boolean
          default: true
          description: Whether to store the successful token in backend runtime memory for subsequent refresh calls and resource processing.
        update_runtime:
          type: boolean
          description: Alias of store; kept for frontend compatibility.
      example:
        pacmtoken: current-pacmtoken
        store: true
    PacmtokenRefreshResponse:
      type: object
      description: Refresh result. The pacmtoken value is returned only so the frontend timer can keep its local state in sync; do not log it.
      required: [success, refreshed, pacmtoken, pacmtoken_length, updated_at]
      properties:
        success:
          type: boolean
        refreshed:
          type: boolean
          description: True when checkPacMtoken returned a different token.
        pacmtoken:
          type: string
          description: Token returned for frontend timer state. Do not log this value.
        pacmtoken_length:
          type: integer
          minimum: 0
        upstream_status:
          nullable: true
          type: integer
        updated_at:
          type: integer
          minimum: 0
        message:
          type: string
      example:
        success: true
        refreshed: true
        pacmtoken: new-pacmtoken
        pacmtoken_length: 56
        upstream_status: 200
        updated_at: 1779370000
        message: migu pacmtoken refreshed
    PacmtokenStateResponse:
      type: object
      description: Runtime pacmtoken state without exposing the token value.
      required: [configured, has_pacmtoken, pacmtoken_length, updated_at]
      properties:
        configured:
          type: boolean
        has_pacmtoken:
          type: boolean
        pacmtoken_length:
          type: integer
          minimum: 0
        updated_at:
          nullable: true
          type: integer
          minimum: 0
    PacmtokenCurrentResponse:
      type: object
      description: Runtime pacmtoken current value for explicit frontend sync. Do not log this response body.
      required: [configured, has_pacmtoken, pacmtoken_length, updated_at, pacmtoken]
      properties:
        configured:
          type: boolean
        has_pacmtoken:
          type: boolean
        pacmtoken_length:
          type: integer
          minimum: 0
        updated_at:
          nullable: true
          type: integer
          minimum: 0
        pacmtoken:
          type: string
          description: Current runtime token; never persisted by the backend.
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
